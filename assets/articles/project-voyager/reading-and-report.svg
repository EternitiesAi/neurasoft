<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#e7aa78" stroke-width="1.5"/></marker></defs><rect width="1200" height="780" fill="#14292f"/><text x="60" y="62" fill="#e7aa78" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">PROJECT VOYAGER / FIRST MILESTONE</text><text x="60" y="122" fill="#f3eee1" font-family="Georgia,serif" font-size="43">One condition. Two ways of asking.</text><rect x="330" y="170" width="540" height="80" fill="#203a41" stroke="#6e8589"/><text x="600" y="218" text-anchor="middle" fill="#f3eee1" font-family="Georgia,serif" font-size="29">The same supplied internal signal</text><g fill="none" stroke="#e7aa78" stroke-width="2" marker-end="url(#a)"><path d="M465 250V287H290V327"/><path d="M735 250V287H910V327"/><path d="M290 453V505"/><path d="M910 453V505"/></g><g transform="translate(60,333)"><rect width="460" height="116" fill="#203a41" stroke="#6e8589"/><text x="20" y="29" fill="#e7aa78" font-family="Consolas,monospace" font-size="14">PASS A</text><text x="20" y="65" fill="#f3eee1" font-family="Georgia,serif" font-size="29">Conversational report</text><text x="20" y="96" fill="#c3d1ce" font-family="Arial,sans-serif" font-size="18">Signal + dialogue + question</text></g><g transform="translate(680,333)"><rect width="460" height="116" fill="#203a41" stroke="#6e8589"/><text x="20" y="29" fill="#e7aa78" font-family="Consolas,monospace" font-size="14">PASS B</text><text x="20" y="65" fill="#f3eee1" font-family="Georgia,serif" font-size="29">Separate reading</text><text x="20" y="96" fill="#c3d1ce" font-family="Arial,sans-serif" font-size="18">Signal + fixed question; no dialogue</text></g><g font-family="Arial,sans-serif" font-size="21" fill="#d0dbd7"><text x="290" y="540" text-anchor="middle">Can follow the misleading story</text><text x="910" y="540" text-anchor="middle">Stays closer to its reading baseline</text></g><path d="M290 570V605H910V570" fill="none" stroke="#82999b"/><text x="600" y="648" text-anchor="middle" fill="#a6d3df" font-family="Georgia,serif" font-size="28">Compare both with the known supplied condition.</text><text x="60" y="715" fill="#c3d1ce" font-family="Arial,sans-serif" font-size="18">The signal is supplied again in each pass. The entire conversational state is not preserved.</text><text x="60" y="752" fill="#9eb3b4" font-family="Arial,sans-serif" font-size="14">Procedure diagram / Selected laboratory results, not a pooled benchmark or an experience measure.</text></svg>