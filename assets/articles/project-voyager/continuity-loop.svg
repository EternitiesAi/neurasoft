<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#e7aa78" stroke-width="1.5"/></marker></defs><rect width="1200" height="770" fill="#14292f"/><text x="60" y="62" fill="#e7aa78" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">PROJECT VOYAGER / PROPOSED ARCHITECTURE</text><text x="60" y="118" fill="#f3eee1" font-family="Georgia,serif" font-size="42">A continuing loop, not a longer conversation.</text><g fill="none" stroke="#e7aa78" stroke-width="2" marker-end="url(#a)"><path d="M345 248H455"/><path d="M745 248H855"/><path d="M1000 306V430"/><path d="M860 488H750"/><path d="M460 488H350"/><path d="M200 430V310"/><path d="M600 430V315" stroke-dasharray="5 6"/></g><g transform="translate(60,190)"><rect width="285" height="116" fill="#203a41" stroke="#6e8589"/><text x="20" y="29" fill="#e7aa78" font-family="Consolas,monospace" font-size="14">01 / BODY</text><text x="20" y="65" fill="#f3eee1" font-family="Georgia,serif" font-size="29">Internal condition</text><text x="20" y="96" fill="#c3d1ce" font-family="Arial,sans-serif" font-size="18">Needs, load, rest, recovery</text></g><g transform="translate(460,190)"><rect width="285" height="116" fill="#203a41" stroke="#6e8589"/><text x="20" y="29" fill="#e7aa78" font-family="Consolas,monospace" font-size="14">02 / CONTINUITY</text><text x="20" y="65" fill="#f3eee1" font-family="Georgia,serif" font-size="29">Continuing stream</text><text x="20" y="96" fill="#c3d1ce" font-family="Arial,sans-serif" font-size="18">State carried into the next step</text></g><g transform="translate(860,190)"><rect width="280" height="116" fill="#203a41" stroke="#6e8589"/><text x="20" y="29" fill="#e7aa78" font-family="Consolas,monospace" font-size="14">03 / DELIBERATION</text><text x="20" y="65" fill="#f3eee1" font-family="Georgia,serif" font-size="29">Attention + thought</text><text x="20" y="96" fill="#c3d1ce" font-family="Arial,sans-serif" font-size="18">What deserves more effort?</text></g><g transform="translate(860,430)"><rect width="280" height="116" fill="#203a41" stroke="#6e8589"/><text x="20" y="29" fill="#e7aa78" font-family="Consolas,monospace" font-size="14">04 / AGENCY</text><text x="20" y="65" fill="#f3eee1" font-family="Georgia,serif" font-size="29">Action</text><text x="20" y="96" fill="#c3d1ce" font-family="Arial,sans-serif" font-size="18">A choice with consequences</text></g><g transform="translate(460,430)"><rect width="285" height="116" fill="#203a41" stroke="#6e8589"/><text x="20" y="29" fill="#e7aa78" font-family="Consolas,monospace" font-size="14">05 / FEEDBACK</text><text x="20" y="65" fill="#f3eee1" font-family="Georgia,serif" font-size="29">World + evidence</text><text x="20" y="96" fill="#c3d1ce" font-family="Arial,sans-serif" font-size="18">What actually happened?</text></g><g transform="translate(60,430)"><rect width="285" height="116" fill="#203a41" stroke="#6e8589"/><text x="20" y="29" fill="#e7aa78" font-family="Consolas,monospace" font-size="14">06 / LEARNING</text><text x="20" y="65" fill="#f3eee1" font-family="Georgia,serif" font-size="29">Memory + revision</text><text x="20" y="96" fill="#c3d1ce" font-family="Arial,sans-serif" font-size="18">Preserve, retrieve, reconsider</text></g><text x="620" y="376" fill="#a6d3df" font-family="Arial,sans-serif" font-size="18">New evidence</text><text x="60" y="635" fill="#a6d3df" font-family="Georgia,serif" font-size="29">The connections are the experiment.</text><text x="60" y="677" fill="#c3d1ce" font-family="Arial,sans-serif" font-size="20">Does each state reach a decision? Does the outcome change what comes next?</text><text x="60" y="733" fill="#9eb3b4" font-family="Arial,sans-serif" font-size="15">Conceptual diagram. Intended integration; not a map of verified deployment.</text></svg>