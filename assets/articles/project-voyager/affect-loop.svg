<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#e7aa78" stroke-width="1.5"/></marker></defs><rect width="1200" height="690" fill="#14292f"/><text x="60" y="62" fill="#e7aa78" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">PROJECT VOYAGER / AFFECT AS A PROCESS</text><text x="60" y="120" fill="#f3eee1" font-family="Georgia,serif" font-size="42">A concern must have somewhere to go.</text><g transform="translate(60,190)"><rect width="300" height="116" fill="#203a41" stroke="#6e8589"/><text x="20" y="29" fill="#e7aa78" font-family="Consolas,monospace" font-size="14">01 / APPRAISAL</text><text x="20" y="65" fill="#f3eee1" font-family="Georgia,serif" font-size="29">An event matters</text><text x="20" y="96" fill="#c3d1ce" font-family="Arial,sans-serif" font-size="18">A promise may be missed</text></g><g transform="translate(450,190)"><rect width="300" height="116" fill="#203a41" stroke="#6e8589"/><text x="20" y="29" fill="#e7aa78" font-family="Consolas,monospace" font-size="14">02 / REGULATION</text><text x="20" y="65" fill="#f3eee1" font-family="Georgia,serif" font-size="29">State changes</text><text x="20" y="96" fill="#c3d1ce" font-family="Arial,sans-serif" font-size="18">Urgency, uncertainty, concern</text></g><g transform="translate(840,190)"><rect width="300" height="116" fill="#203a41" stroke="#6e8589"/><text x="20" y="29" fill="#e7aa78" font-family="Consolas,monospace" font-size="14">03 / ACTION</text><text x="20" y="65" fill="#f3eee1" font-family="Georgia,serif" font-size="29">Choice changes</text><text x="20" y="96" fill="#c3d1ce" font-family="Arial,sans-serif" font-size="18">Reconsider, ask, repair</text></g><g stroke="#e7aa78" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M360 248H445"/><path d="M750 248H835"/><path d="M990 306V455H210V313"/></g><text x="480" y="435" fill="#a6d3df" font-size="24" font-family="Georgia,serif">The outcome revises the condition.</text><path d="M600 307V354" stroke="#a6d3df" stroke-dasharray="5 6"/><text x="600" y="383" text-anchor="middle" fill="#a6d3df" font-size="17" font-family="Arial,sans-serif">Expression is one readout, not the whole process.</text><text x="60" y="560" fill="#f3eee1" font-family="Georgia,serif" font-size="29">Remove the state. Change its cause. Observe the choice.</text><text x="60" y="604" fill="#c3d1ce" font-family="Arial,sans-serif" font-size="20">A proposed causal test of function—not a measurement of subjective experience.</text><text x="60" y="653" fill="#9eb3b4" font-family="Arial,sans-serif" font-size="15">Conceptual diagram / Neurasoft research</text></svg>