<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t"><title id="t">Two histories, one later choice</title><rect width="1200" height="630" fill="#f0eadc"/><text x="64" y="95" font-family="Georgia" font-size="47" fill="#243d3b" >Two histories, one later choice</text><text x="64" y="140" font-family="Georgia" font-size="23" fill="#526563" font-style="italic">A proposed experiment</text><path d="M173 337C300 337 310 239 448 239H690C818 239 854 337 1008 337" fill="none" stroke="#3f766c" stroke-width="5"/><path d="M173 337C300 337 310 432 448 432H690C818 432 854 337 1008 337" fill="none" stroke="#a06341" stroke-width="5" stroke-dasharray="12 8"/><circle cx="172" cy="337" r="11" fill="#f0eadc" stroke="#334e4d" stroke-width="4"/><circle cx="550" cy="239" r="11" fill="#f0eadc" stroke="#3f766c" stroke-width="4"/><circle cx="550" cy="432" r="11" fill="#f0eadc" stroke="#a06341" stroke-width="4"/><circle cx="1008" cy="337" r="11" fill="#f0eadc" stroke="#334e4d" stroke-width="4"/><text x="172" y="300" font-family="Georgia" font-size="26" fill="#253e3d" text-anchor="middle">Luna draws a map</text><text x="550" y="212" font-family="Georgia" font-size="26" fill="#253e3d" text-anchor="middle">The map helps</text><text x="550" y="479" font-family="Georgia" font-size="26" fill="#253e3d" text-anchor="middle">The map stays folded</text><text x="1000" y="300" font-family="Georgia" font-size="26" fill="#253e3d" text-anchor="middle">Someone else asks</text><path d="M64 530H1136" stroke="#a8b1a5"/><text x="64" y="584" font-family="Georgia" font-size="27" fill="#334d4a" >What does she remember? What does she check? Does she help again?</text></svg>