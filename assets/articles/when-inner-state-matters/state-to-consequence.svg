<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">A changed state is not yet a changed choice</title><desc id="desc">Exploratory tension repairs changed internal readings but not the tested action counts or sleep/wake state sequences. A proposed causal test should trace particular evidence through preparation, choice and observed consequence.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#577960" stroke-width="1.3"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#203b34}.serif{font-family:Georgia,serif}.small{font-size:19px;fill:#536c5e}.label{font-size:23px}</style>
<rect width="800" height="800" fill="#f5f2e9"/>
<text x="42" y="53" font-size="17" letter-spacing="2" fill="#54775f">NEURASOFT / CAUSAL QUESTION</text>
<text x="42" y="111" font-size="40" class="serif">A different reading. A different life?</text>
<text x="42" y="151" class="small">Keep the observed result separate from the next proposed test.</text>
<text x="42" y="215" font-size="18" letter-spacing="2">OBSERVED IN THE EXPLORATORY SIMULATION</text>
<rect x="40" y="241" width="720" height="148" rx="12" fill="#e7ede2" stroke="#bcc9bb"/>
<text x="65" y="283" class="label">Candidate tension repairs</text>
<text x="65" y="328" class="small">Internal readings changed.</text>
<text x="65" y="360" class="small">Tested action counts and lifecycle sequences did not.</text>
<text x="42" y="440" font-size="18" letter-spacing="2">PROPOSED: MAKE THE PARTICULAR CONCERN CAUSAL</text>
<g fill="#f7f6ef" stroke="#bcc9bb"><rect x="40" y="465" width="329" height="102" rx="10"/><rect x="430" y="465" width="330" height="102" rx="10"/><rect x="430" y="612" width="330" height="102" rx="10"/><rect x="40" y="612" width="329" height="102" rx="10"/></g>
<text x="62" y="506" class="label">A particular memory</text><text x="62" y="541" class="small">Evidence, not generic warmth</text>
<text x="452" y="506" class="label">Preparation and choice</text><text x="452" y="541" class="small">What changes, and why?</text>
<text x="452" y="653" class="label">Observed consequence</text><text x="452" y="688" class="small">What actually happened?</text>
<text x="62" y="653" class="label">The next relevant belief</text><text x="62" y="688" class="small">Revise, retain, hold or rest</text>
<g fill="none" stroke="#577960" stroke-width="3" marker-end="url(#arrow)"><path d="M373 516H419"/><path d="M594 572V600"/><path d="M423 664H380"/><path d="M203 605V577"/></g>
<text x="42" y="766" font-size="18" fill="#536c5e">Conceptual test design · No achieved emotional or experiential claim</text>
</svg>
